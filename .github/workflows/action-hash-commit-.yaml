name: 🧪 Check Version Pinning

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check-version-pinning:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for unpinned Actions
        uses: ministryofjustice/github-actions/check-version-pinning@db1a54895bf5fb975c60af47e5a3aab96505ca3e # v18.6.0
        with:
          workflow_directory: ".github/workflows"
          scan_mode: "pr_changes"